name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
  
      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t taxi-demand-api .

      - name: Start Docker container
        run: docker run -d --name taxi-demand-api-test -p 8000:8000 taxi-demand-api

      - name: Test health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8000/; then
              exit 0
            fi
            sleep 1
          done
          exit 1
